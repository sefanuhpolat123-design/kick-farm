name: build-apk
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK hazirla
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null || echo "platform listesi yok"
      - name: Kaynak ZIP indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src && cd src
          gh release download "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" -p "*.zip" --clobber
          unzip -qo *.zip
      - name: Derle
        run: |
          cd src
          P=$(find . -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$P"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug --no-daemon -x lint
      - name: Release'e APK ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find . -name app-debug.apk | head -1)
          [ -n "$APK" ] || { echo "APK yok"; exit 1; }
          gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: kickfarm-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
