name: build-apk

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            >/dev/null

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "Android SDK hazır."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak hazırla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/buildsrc
          USED_ZIP=""

          # 1) Release asset zip
          if [ "${{ github.event_name }}" = "release" ]; then
            cd /tmp/buildsrc
            gh release download "${{ github.event.release.tag_name }}" \
              -R "${{ github.repository }}" -p "*.zip" --clobber 2>/dev/null || true
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "==> Release zip: $ZIP"
              unzip -qo "$ZIP"
              USED_ZIP="$ZIP"
            fi
          fi

          # 2) Repo içindeki zip (senin durumun bu)
          if [ -z "$USED_ZIP" ]; then
            cd "$GITHUB_WORKSPACE"
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "==> Repo içindeki zip kullanılıyor: $ZIP"
              unzip -qo "$ZIP" -d /tmp/buildsrc
              USED_ZIP="$ZIP"
            fi
          fi

          # 3) Workflow_dispatch + son release
          if [ -z "$USED_ZIP" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd /tmp/buildsrc
            gh release download -R "${{ github.repository }}" -p "*.zip" --clobber 2>/dev/null || true
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "==> Son release zip: $ZIP"
              unzip -qo "$ZIP"
              USED_ZIP="$ZIP"
            fi
          fi

          # 4) Hiç zip yoksa repo kaynağı
          if [ -z "$USED_ZIP" ]; then
            echo "==> Zip yok, repo kaynağı kopyalanıyor"
            cp -a "$GITHUB_WORKSPACE/." /tmp/buildsrc/
          fi

          echo "==> /tmp/buildsrc içeriği:"
          find /tmp/buildsrc -maxdepth 4 \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.gradle*" \) | head -40
          echo "---"
          find /tmp/buildsrc -maxdepth 3 -type d | head -30

      - name: Gradle ile APK derle
        run: |
          set -e
          ROOT=$(find /tmp/buildsrc -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$ROOT" ]; then
            echo "HATA: settings.gradle.kts hâlâ bulunamadı"
            echo "Tüm dosyalar:"
            find /tmp/buildsrc -type f | head -100
            exit 1
          fi
          echo "==> Proje kökü: $ROOT"
          cd "$ROOT"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

          echo "==> APK'lar:"
          find . -name "*.apk" -type f

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: kickfarm-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release'e APK ekle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find /tmp/buildsrc -name "*debug*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find /tmp/buildsrc -name "*.apk" | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "Yükleniyor: $APK"
            gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
          else
            echo "HATA: APK bulunamadı"
            exit 1
          fi
