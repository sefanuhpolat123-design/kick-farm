name: build-apk
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
permissions:
  contents: write
concurrency: apk-build
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK hazirla
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
      - name: ZIP ac
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -1)
          [ -n "$ZIP" ] || { echo "repoda zip yok"; exit 1; }
          mkdir -p /tmp/src && unzip -qo "$ZIP" -d /tmp/src
          P=$(find /tmp/src -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -1)
          [ -n "$P" ] || { echo "zip icinde proje yok"; exit 1; }
          echo "PROJ=$P" >> "$GITHUB_ENV"
      - name: Derle
        run: |
          cd "$PROJ"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug --no-daemon -x lint
      - name: APK topla
        run: cp "$(find "$PROJ" -name app-debug.apk | head -1)" /tmp/kickfarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kickfarm-apk
          path: /tmp/kickfarm.apk
      - name: Indirmeye ac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view build > /dev/null 2>&1 || gh release create build --title "APK" --notes "son build"
          gh release upload build /tmp/kickfarm.apk --clobber
