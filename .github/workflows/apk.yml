name: build-apk

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android lisans sorusunda takılıyor.
      # Bu yüzden SDK'yı elle kuruyoruz ve lisansları otomatik kabul ediyoruz.
      - name: Setup Android SDK
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          # Command-line tools indir
          cd /tmp
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          # Klasör adını "latest" yap
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # Lisansları otomatik kabul et
          yes | sdkmanager --licenses >/dev/null || true

          # Gerekli paketleri yükle
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            >/dev/null

          # Sonraki adımlar için ortam değişkenlerini kaydet
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          echo "Android SDK kuruldu: $ANDROID_HOME"
          sdkmanager --list_installed | head -20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kaynak hazırla (zip varsa onu kullan, yoksa repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/buildsrc

          USED_ZIP=0
          if [ "${{ github.event_name }}" = "release" ]; then
            cd /tmp/buildsrc
            gh release download "${{ github.event.release.tag_name }}" \
              -R "${{ github.repository }}" -p "*.zip" --clobber 2>/dev/null || true
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "==> Release zip kullanılıyor: $ZIP"
              unzip -qo "$ZIP"
              USED_ZIP=1
            fi
          fi

          if [ "$USED_ZIP" = "0" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cd /tmp/buildsrc
            gh release download -R "${{ github.repository }}" -p "*.zip" --clobber 2>/dev/null || true
            ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "==> En son release zip kullanılıyor: $ZIP"
              unzip -qo "$ZIP"
              USED_ZIP=1
            fi
          fi

          if [ "$USED_ZIP" = "0" ]; then
            echo "==> Zip bulunamadı, repo kaynağı kullanılıyor"
            cp -a "$GITHUB_WORKSPACE/." /tmp/buildsrc/
          fi

          echo "==> Kaynak ağacı:"
          find /tmp/buildsrc -maxdepth 4 -type f | head -50

      - name: Gradle ile APK derle
        run: |
          set -e
          ROOT=$(find /tmp/buildsrc -name settings.gradle.kts -printf '%h\n' | head -1)
          if [ -z "$ROOT" ]; then
            echo "HATA: settings.gradle.kts bulunamadı"
            find /tmp/buildsrc -type f | head -80
            exit 1
          fi
          echo "==> Proje kökü: $ROOT"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

          echo "==> Üretilen APK'lar:"
          find . -name "*.apk" -type f

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: kickfarm-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release'e APK ekle
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find /tmp/buildsrc -name "app-debug.apk" -o -name "*-debug.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find /tmp/buildsrc -name "*.apk" | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "Yükleniyor: $APK"
            gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
            echo "APK release'e eklendi."
          else
            echo "HATA: APK bulunamadı"
            exit 1
          fi
